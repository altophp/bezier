<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -65 240 260" role="img" aria-labelledby="title desc">
<title id="title">The first cubic curve</title><desc id="desc">Control points at 0,0; 40,160; 160,-40; 200,120. The evaluated midpoint is 100,60.</desc>
<rect x="-20" y="-65" width="240" height="260" fill="white"/>
<polyline points="0,0 40,160 160,-40 200,120" fill="none" stroke="#68717a" stroke-dasharray="4 4"/>
<path d="M 0 0 C 40 160 160 -40 200 120" fill="none" stroke="#245ca6" stroke-width="3"/>
<g fill="#245ca6"><circle cx="0" cy="0" r="3"/><circle cx="40" cy="160" r="3"/><circle cx="160" cy="-40" r="3"/><circle cx="200" cy="120" r="3"/></g>
<circle cx="100" cy="60" r="4" fill="#a64614"/>
<g font-family="sans-serif" font-size="10" fill="#1d2935"><text x="2" y="-10">0, 0</text><text x="25" y="180">40, 160</text><text x="135" y="-50">160, -40</text><text x="156" y="140">200, 120</text><text x="108" y="62">100, 60</text></g>
</svg>
